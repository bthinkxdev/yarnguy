{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · YARN GUY Admin</title>
  <link rel="icon" type="image/png" href="{% if site_settings.logo %}{{ site_settings.logo.url }}{% else %}{% static 'dashboard/images/logo.png' %}{% endif %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="{% static 'dashboard/css/dashboard.css' %}" rel="stylesheet" />
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card" style="max-width: 420px; width: 100%;">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <a href="{% url 'dashboard:login' %}" class="mb-3 d-inline-flex align-items-center">
            <img src="{% if site_settings.logo %}{{ site_settings.logo.url }}{% else %}{% static 'dashboard/images/logo.png' %}{% endif %}" alt="YARN GUY Admin" width="36" height="36" style="border-radius: 50%; object-fit: contain;" />
            <span class="ms-2 fw-semibold fs-5">YARN GUY Admin</span>
          </a>
          <h1 class="card-title h5 mb-0">Sign in to your account</h1>
        </div>

        {% if messages %}
          {% for message in messages %}
          <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} py-2">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <form class="needs-validation mt-3" method="post" novalidate>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}" />
          <div class="mb-3">
            <label for="email" class="form-label">Email or username</label>
            <input id="email" name="email" type="text" class="form-control" placeholder="name@example.com" required autofocus />
            <div class="invalid-feedback">Please enter your email or username.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" class="form-control" placeholder="Password" required />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'dashboard/js/dashboard.js' %}"></script>
</body>
</html>
