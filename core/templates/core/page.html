{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ seo_title }}{% endblock %}

{% block content %}
<div class="container page-container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-8">
      
      <h1 class="section-title mb-4">{{ page.title|title }}</h1>
      
      <div class="page-content bg-white p-4 p-md-5 rounded shadow-sm">
        {{ page.body|safe }}
      </div>
      
    </div>
  </div>
</div>
{% endblock %}
