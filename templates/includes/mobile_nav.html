{% load i18n %}
<nav class="mobile-bottom-nav d-lg-none jm-mnav" aria-label="{% trans 'Mobile navigation' %}">
  <a href="{% url 'cms:homepage' %}" class="jm-mnav__item {% if request.resolver_match.url_name == 'homepage' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>{% trans "Home" %}</span>
  </a>
  <a href="{% url 'cms:homepage' %}#jm-categories" class="jm-mnav__item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span>{% trans "Categories" %}</span>
  </a>
  <a href="{% url 'catalog:plp' %}" class="jm-mnav__item {% if request.resolver_match.app_name == 'catalog' and request.resolver_match.url_name != 'pdp' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 2h12l1 7H5L6 2z"/><path d="M5 9v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9"/><path d="M9 13h6"/></svg>
    <span>{% trans "Shop" %}</span>
  </a>
  <a href="{% url 'accounts:wishlist' %}"
     id="jm-mnav-wishlist"
     class="jm-mnav__item jm-mnav__item--wishlist {% if request.resolver_match.url_name == 'wishlist' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>{% trans "Wishlist" %}</span>
    <span id="wishlist-count-mnav"
          class="jm-mnav__badge-wrap"
          hx-get="{% url 'cart:wishlist-count' %}"
          hx-trigger="load, wishlistUpdated from:body, pageshow from:window"
          hx-swap="innerHTML"
          aria-live="polite">
      {% include "cart/partials/wishlist_count_badge.html" with count=wishlist_count %}
    </span>
  </a>
  <a href="{% if user.is_authenticated %}{% url 'accounts:dashboard' %}{% else %}{% url 'accounts:login-email-otp' %}{% endif %}"
     class="jm-mnav__item {% if request.resolver_match.app_name == 'accounts' and request.resolver_match.url_name != 'wishlist' %}is-active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>{% trans "Account" %}</span>
  </a>
</nav>
