{% load static %}{% if meta_pixel_id %}
<!-- Meta Pixel: base code + PageView (once per full page load; HTMX swaps never re-fire it) -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '{{ meta_pixel_id|escapejs }}');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id={{ meta_pixel_id|urlencode }}&amp;ev=PageView&amp;noscript=1"></noscript>
<script src="{% static 'js/meta_pixel.js' %}?v=1" defer></script>
{% endif %}
