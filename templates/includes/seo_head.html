{% load i18n %}

{% if seo_description %}<meta name="description" content="{{ seo_description }}">{% endif %}
{% if seo_canonical_url %}<link rel="canonical" href="{{ seo_canonical_url }}">{% endif %}
{% for alt in seo_hreflang_urls %}
<link rel="alternate" hreflang="{{ alt.lang_code }}" href="{{ alt.url }}">
{% endfor %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ seo_title }}">
{% if seo_description %}<meta property="og:description" content="{{ seo_description }}">{% endif %}
{% if seo_canonical_url %}<meta property="og:url" content="{{ seo_canonical_url }}">{% endif %}
{% if seo_og_image %}<meta property="og:image" content="{{ seo_og_image }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo_title }}">
{% if seo_description %}<meta name="twitter:description" content="{{ seo_description }}">{% endif %}
