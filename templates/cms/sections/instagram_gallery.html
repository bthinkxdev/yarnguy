{% load i18n %}
<section class="container mb-5 instagram-follow-section">
  {% include "cms/sections/_section_title.html" with section_context=section_context fallback_key="Follow Us" %}

  <a href="https://instagram.com/{{ section_context.instagram_handle|default:'floward' }}"
     class="instagram-follow-card"
     target="_blank"
     rel="noopener noreferrer">
    <span class="instagram-follow-icon" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/>
      </svg>
    </span>
    <span class="instagram-follow-text">
      <span class="instagram-follow-label">{% trans "Follow us on Instagram" %}</span>
      {% if section_context.instagram_handle %}
        <span class="instagram-follow-handle">@{{ section_context.instagram_handle }}</span>
      {% endif %}
    </span>
  </a>
</section>
